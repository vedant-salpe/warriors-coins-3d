 S.pets.forEach(p=>{(p.m.userData.wings||[]).forEach(([w,s])=>w.rotation.z=s*Math.sin(tm*(p.m.userData.tuck?7:10))*(p.m.userData.tuck?.8:.6))});
 const walk=(m,a)=>(m.userData.legs||[]).forEach((l,i)=>l.rotation.x=m.userData.tuck?.9:Math.sin(tm*10+(i%3?Math.PI:0))*a);S.en.forEach(e=>walk(e.m,.7));S.pets.forEach(p=>walk(p.m,.5));walk(hero,(keys.w||keys.a||keys.s||keys.d||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight)?.7:0);flashL.intensity*=.8;
 R.render(sc,cam);hud();
 if(S.over)say('You were defeated. Press R to respawn (you keep your gear).');requestAnimationFrame(loop)}
/* shop and memberships */
function buy(cost,fn){if(S.coins<cost)return say('Not enough coins. Defeat more enemies.');S.coins-=cost;fn();render()}
function grant(t){for(const x of TIERS.filter(x=>x.lvl>S.member&&x.lvl<=t.lvl)){
  if(x.lvl==1){S.owned.plusdragon=1;equipPet('plusdragon',true)}giveGear(x.lvl+5);S.jets+=[0,3,7,20][x.lvl];
  if(x.lvl==2){S.dyn+=100;S.coins+=100}if(x.lvl==3){S.nuke+=30}}S.member=t.lvl;render()}
function subscribe(t){const u=PAY_LINKS[t.lvl];
 if(!u)return say('Real payments are not connected yet. The owner needs to add a payment link for '+t.name+'.');
 window.open(u,'_blank','noopener');say('Finish paying in the new tab. '+t.name+' unlocks once the payment is verified.')}
function render(){let h=`<div><b style="font-size:20px">Shop</b> &nbsp; 🪙 ${S.coins} &nbsp;<button id="x">Close (B)</button></div><div>`;
 for(const [k,l] of [['guns','Guns'],['gear','Gear'],['items','Jets & items'],['pets','Pets'],['mem','Memberships']])h+=`<button data-tab="${k}" ${tab===k?'style="background:var(--accent);color:#fff"':''}>${l}</button>`;h+='</div>';
 if(tab==='guns')for(const g of GUNS){const own=S.guns[g.id],eq=S.gun===g.id;
  h+=`<div class="item"><span><b>${g.name}</b><small>Damage ${g.dmg}${g.pel>1?' × '+g.pel:''}, fires every ${g.rate} ms</small></span><button data-gun="${g.id}" ${eq?'disabled':''}>${eq?'Equipped':own?'Equip':'Buy 🪙'+g.cost}</button></div>`}
 if(tab==='pets'){h+=petUI();for(const p of []){if(p.plus&&S.member<1)continue;const own=S.pets.find(q=>q.id===p.id);
  h+=`<div class="item"><span><b>${p.name}</b><small>Attacks nearby enemies for ${p.dps} damage per second</small></span><button data-pet="${p.id}" ${own?'disabled':''}>${own?'Owned':'Buy 🪙'+p.cost}</button></div>`}
  if(S.member<1)h+='<p>Plus members also get a Dragon, the strongest pet.</p>'}
 if(tab==='gear')h+=gearUI();if(tab==='items')h+=itemsUI();if(tab==='mem')for(const t of TIERS)h+=`<div class="item tier"><span><b>${t.name}: $${t.price} per year</b><small>${t.desc}</small></span><span><button data-mem="${t.lvl}" ${S.member>=t.lvl?'disabled':''}>${S.member>=t.lvl?'Active':'Buy $'+t.price}</button><button data-prev="${t.lvl}" ${S.member>=t.lvl?'disabled':''}>Free preview</button></span></div>`;
 $('shop').innerHTML=h;$('shop').style.display='block'}
$('shop').addEventListener('click',e=>{const d=e.target.dataset;if(e.target.id==='x')return toggle();
 if(d.tab){tab=d.tab;render()}
 if(d.gun){const g=GUNS.find(x=>x.id===d.gun);if(S.guns[g.id]){S.gun=g.id;render()}else buy(g.cost,()=>{S.guns[g.id]=1;S.gun=g.id})}
 if(d.pet){const p=PM[d.pet];buy(p.cost,()=>{S.owned[p.id]=1;equipPet(p.id)})}
 if(d.eq){equipPet(d.eq);render()}
 if(d.gb){const g=GI[d.gb];buy(g.cost,()=>{S.gOwned[g.id]=1;S.gear[g.slot]=g.id;recalc();rebuild()})}
 if(d.ge){S.gear[GI[d.ge].slot]=d.ge;recalc();rebuild();render()}
 if(d.flt!==undefined){pf=d.flt;pg=0;render()}
 if(d.pgo){pg+=+d.pgo;render()}
 if(d.it){const it=ITEMS[+d.it];buy(it.cost,()=>{S[it.k]+=it.n})}
 if(d.mem)subscribe(TIERS.find(x=>x.lvl==+d.mem));if(d.prev){grant(TIERS.find(x=>x.lvl==+d.prev));say('Free preview of the perks. This is not a purchase.')}});
function toggle(){shopOpen=!shopOpen;if(shopOpen)render();else $('shop').style.display='none'}
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();keys[k]=1;if(k==='b')toggle();if(shopOpen)return;
 if(k==='e')dyn();if(k==='n')nuke();if(k==='j')jets();
 if(k==='r'&&S.over){const k2={coins:S.coins,dyn:S.dyn,nuke:S.nuke,jets:S.jets,gun:S.gun,guns:S.guns,pets:S.pets,owned:S.owned,act:S.act,gear:S.gear,gOwned:S.gOwned,member:S.member,max:S.max};S.pets.forEach(p=>sc.remove(p.m));fresh(k2)}
 if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)});
cv.addEventListener('pointerdown',e=>{cv.dispatchEvent(new PointerEvent('pointermove',e));mouse.down=true});
addEventListener('pointerup',()=>mouse.down=false);
$('shop').addEventListener('change',e=>{if(e.target.id==='spf'){ps=e.target.value;pg=0;render()}});$('bShop').onclick=toggle;$('bDyn').onclick=dyn;$('bNuke').onclick=nuke;$('bJet').onclick=jets;
requestAnimationFrame(loop);
</script></body></html>
